name: Shorts Autopilot

on:
  schedule:
    # Horario configurado por setup_wizard.py (hora UTC; ajusta para tu zona)
    - cron: '15 12 * * *'
    - cron: '15 18 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Número de vídeos a publicar en esta ejecución'
        required: false
        type: number
        default: 1
      dry_run:
        description: 'Modo simulación (sin publicar)'
        required: false
        type: boolean
        default: false
      item_id:
        description: 'ID de un tema concreto (dejar vacío para el siguiente en cola)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  issues: write

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar FFmpeg y fuentes
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-freefont-ttf

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar autopilot
        env:
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.count }}" ]; then
            ARGS="$ARGS --count ${{ inputs.count }}"
          fi
          if [ -n "${{ inputs.item_id }}" ]; then
            ARGS="$ARGS ${{ inputs.item_id }}"
          fi
          python autopilot.py $ARGS

      - name: Guardar estado de la cola en git
        if: always()
        run: |
          git config user.name "shorts-automator-bot"
          git config user.email "bot@localhost"
          git add queue.json published_log.json
          if git diff --staged --quiet; then
            echo "Sin cambios en la cola."
          else
            git commit -m "chore: actualizar cola de publicaciones [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
